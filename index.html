<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض دحوم</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Cairo', sans-serif;
    background: #0d0d0d;
    color: #eee;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 20px 16px;
    background: linear-gradient(180deg, #1a0505, #0d0d0d);
    border-bottom: 2px solid #ff3333;
  }
  header h1 { color: #ff4444; font-size: 1.5rem; }
  header p { opacity: 0.7; font-size: 0.9rem; margin-top: 4px; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid #333;
    cursor: pointer;
    transition: 0.2s;
  }
  .gallery img:hover {
    border-color: #ff4444;
    transform: scale(1.03);
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 94vw;
    max-height: 80vh;
    border-radius: 8px;
    border: 2px solid #ff4444;
  }
  #lightbox .close {
    position: absolute;
    top: 16px;
    left: 16px;
    background: #ff3333;
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
  }
  #lightbox .nav {
    display: flex;
    gap: 20px;
    margin-top: 14px;
  }
  #lightbox .nav button {
    background: #333;
    border: none;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>معرض دحوم</h1>
  <p>اضغط على أي صورة لتكبيرها</p>
</header>

<div class="gallery" id="gallery"></div>

<div id="lightbox">
  <button class="close" onclick="closeLb()">×</button>
  <img id="lbImg" src="" alt="">
  <div class="nav">
    <button onclick="prev()">→ السابق</button>
    <button onclick="next()">التالي ←</button>
  </div>
</div>

<script>
const photos = [
  'abaya_pose.jpg',
  'IMG_6407.jpeg',
  'IMG_6403.jpeg',
  'IMG_6406.jpeg',
  'IMG_6388.jpg',
  'IMG_6491.jpeg',
  'IMG_6492.jpeg',
  'IMG_6493.jpeg',
  'IMG_6494.jpeg',
  'IMG_6499.jpeg',
  'IMG_6500.jpeg',
  'IMG_6385.jpg',
  'mama1.jpg',
  'mama5.jpg',
  'mama3.jpg'
];

const gallery = document.getElementById('gallery');
let current = 0;

photos.forEach((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.alt = '';
  img.onclick = () => openLb(i);
  gallery.appendChild(img);
});

function openLb(i) {
  current = i;
  document.getElementById('lbImg').src = photos[i];
  document.getElementById('lightbox').classList.add('active');
}
function closeLb() {
  document.getElementById('lightbox').classList.remove('active');
}
function next() {
  current = (current + 1) % photos.length;
  document.getElementById('lbImg').src = photos[current];
}
function prev() {
  current = (current - 1 + photos.length) % photos.length;
  document.getElementById('lbImg').src = photos[current];
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLb();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'ArrowLeft') next();
  if (e.key === 'ArrowRight') prev();
  if (e.key === 'Escape') closeLb();
});
</script>
</body>
</html>
